name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Type-check, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify reset script refuses to run in CI
        run: |
          # The reset script must refuse to run in CI environments.
          # This test confirms the safety guard works — it should exit
          # with code 1 and print a refusal message.
          set +e
          output=$(bun run scripts/reset-database.ts 2>&1)
          exit_code=$?
          echo "$output"
          if [ $exit_code -ne 1 ]; then
            echo "✗ FAIL: reset script should exit with code 1 in CI, got $exit_code"
            exit 1
          fi
          if ! echo "$output" | grep -q "Refusing to run in CI"; then
            echo "✗ FAIL: reset script should print refusal message"
            exit 1
          fi
          echo "✓ PASS: reset script correctly refuses to run in CI"

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript type-check
        run: npx tsc --noEmit

      - name: Run production build
        run: npx next build
        env:
          # Provide placeholder env vars so the build doesn't fail on
          # missing configuration. These are NOT real credentials —
          # the build only needs them for type resolution, not runtime.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: https://placeholder.vercel.app
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_placeholder
