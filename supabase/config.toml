# NetLodge — Supabase project configuration (local development).

# Phase 0 baseline. The actual schema migrations land starting in Phase 1
# (Database Foundation) per IMPLEMENTATION_PLAN §22 / §5. This file exists
# now so that `supabase db reset --local` and `supabase start` have a project
# to operate on once Phase 1's first migration is written.

project_id = "netlodge"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
refresh_token_rotation_enabled = true
refresh_token_reuse_detection = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "5MiB"
